plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    // The windowed chatbot. The console one is still there and still works: it is
    // started by running bob.Bob, which is what the text UI test runner does.
    //
    // JavaFX itself is not listed as a dependency because this project builds on a
    // JDK that already carries it (Zulu 25 FX, per AGENTS.md), where javafx.controls
    // and javafx.fxml are modules of the platform. Adding the org.openjfx jars on
    // top would put a second copy of JavaFX on the class path, which the modules in
    // the JDK would shadow anyway.
    mainClass = 'bob.Launcher'

    // JavaFX loads its own native libraries, which Java now warns about unless the
    // module doing it is named as allowed to. The warning says nothing the user of
    // a chatbot can act on, so it is silenced rather than printed at every start.
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'bob.jar'
}

run {
    standardInput = System.in
}
